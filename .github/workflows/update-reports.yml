name: Update ecology reports
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: Report type
        required: true
        default: auto
        type: choice
        options: [auto, daily, weekly, monthly, both]
      month:
        description: Monthly period (YYYY-MM; blank for current)
        required: false
        type: string
      revise:
        description: Explicitly revise an archived month
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ecology-report-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      REPORT_KIND: ${{ github.event.inputs.kind || 'auto' }}
      REPORT_MONTH: ${{ github.event.inputs.month }}
      REPORT_REVISE: ${{ github.event.inputs.revise }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: research-v1-${{ github.run_id }}
          restore-keys: research-v1-
      - name: Test
        run: node --test
      - name: Generate reports
        shell: bash
        run: |
          args=("--kind=$REPORT_KIND")
          if [ -n "$REPORT_MONTH" ]; then args+=("--month=$REPORT_MONTH"); fi
          if [ "$REPORT_REVISE" = "true" ]; then args+=(--revise); fi
          node scripts/update.mjs "${args[@]}"
      - name: Commit report history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ecology reports"
            git push
          fi
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
